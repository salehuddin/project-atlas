<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Project Atlas</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--oc-bg, #101014);
        color: var(--oc-fg, #e8e8ea);
        font-family: var(--oc-font, system-ui, -apple-system, "Segoe UI", sans-serif);
        font-size: 13px;
        line-height: 1.4;
        display: flex;
        flex-direction: column;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }

      /* ------------------------------------------------------------- bar */
      .bar {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        padding: 10px 12px;
        background: var(--oc-bg, #101014);
        border-bottom: 1px solid var(--oc-border, #2a2a31);
      }
      .title {
        font-weight: 600;
        letter-spacing: 0.01em;
        white-space: nowrap;
      }
      .count {
        color: var(--oc-muted, #8b8b96);
        font-weight: 500;
        margin-left: 2px;
      }
      .search {
        flex: 1;
        min-width: 90px;
        background: var(--oc-elevated, #17171d);
        border: 1px solid var(--oc-border, #2a2a31);
        border-radius: 8px;
        padding: 5px 9px;
        outline: none;
      }
      .search:focus {
        border-color: var(--oc-primary, #6c8cff);
      }
      .sort,
      .toggle {
        background: var(--oc-elevated, #17171d);
        border: 1px solid var(--oc-border, #2a2a31);
        border-radius: 8px;
        padding: 5px 8px;
        cursor: pointer;
      }
      .toggle {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        user-select: none;
        white-space: nowrap;
      }
      .toggle input {
        accent-color: var(--oc-primary, #6c8cff);
        margin: 0;
      }
      .icon-btn {
        background: transparent;
        border: 1px solid var(--oc-border, #2a2a31);
        border-radius: 8px;
        padding: 5px 9px;
        cursor: pointer;
        white-space: nowrap;
      }
      .icon-btn:hover,
      .sort:hover,
      .toggle:hover {
        background: var(--oc-hover, #22222b);
      }

      /* ----------------------------------------------------------- notices */
      .notice {
        display: none;
        margin: 10px 12px 0;
        padding: 9px 11px;
        border: 1px solid var(--oc-warning, #b98226);
        border-radius: 9px;
        background: color-mix(in srgb, var(--oc-warning, #b98226) 12%, transparent);
        font-size: 12px;
      }
      .notice.show {
        display: block;
      }
      .notice.error {
        border-color: var(--oc-error, #d4544e);
        background: color-mix(in srgb, var(--oc-error, #d4544e) 12%, transparent);
      }
      .notice b {
        font-weight: 600;
      }
      .notice button {
        margin-left: 8px;
        background: var(--oc-elevated, #17171d);
        border: 1px solid var(--oc-border, #2a2a31);
        border-radius: 6px;
        padding: 2px 8px;
        cursor: pointer;
      }

      /* ------------------------------------------------------------- grid */
      .grid {
        flex: 1;
        overflow-y: auto;
        display: grid;
        gap: 10px;
        padding: 12px;
        grid-template-columns: repeat(auto-fill, minmax(272px, 1fr));
        align-content: start;
      }
      body[data-surface="panel"] .grid {
        grid-template-columns: 1fr;
      }

      .card {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 11px;
        border: 1px solid var(--oc-border, #2a2a31);
        border-radius: calc(var(--oc-radius, 10px) + 2px);
        background: var(--oc-elevated, #17171d);
      }
      .card[data-current="true"] {
        border-color: color-mix(in srgb, var(--oc-primary, #6c8cff) 55%, var(--oc-border, #2a2a31));
      }

      .card-top {
        display: flex;
        align-items: flex-start;
        gap: 8px;
      }
      .avatar {
        position: relative;
        width: 30px;
        height: 30px;
        flex: none;
        border-radius: 8px;
        display: grid;
        place-items: center;
        overflow: visible;
      }
      .avatar img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 8px;
      }
      .avatar-letter {
        font-size: 13px;
        font-weight: 600;
        color: #fff;
        line-height: 1;
      }
      .dot {
        width: 8px;
        height: 8px;
        margin-top: 5px;
        border-radius: 50%;
        background: var(--oc-muted, #8b8b96);
        flex: none;
      }
      .dot.state-dot {
        position: absolute;
        right: -3px;
        bottom: -3px;
        margin: 0;
        width: 10px;
        height: 10px;
        border: 2px solid var(--oc-elevated, #17171d);
        box-sizing: content-box;
        box-shadow: none;
      }
      .dot[data-state="running"] {
        background: var(--oc-info, #3f8fdd);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--oc-info, #3f8fdd) 22%, transparent);
      }
      .dot[data-state="waiting"] {
        background: var(--oc-warning, #b98226);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--oc-warning, #b98226) 22%, transparent);
      }
      .dot[data-state="unread"] {
        background: var(--oc-primary, #6c8cff);
      }
      .dot[data-state="idle"] {
        background: var(--oc-success, #3fa06b);
      }
      .names {
        min-width: 0;
        flex: 1;
      }
      .name {
        display: block;
        width: 100%;
        text-align: left;
        background: none;
        border: 0;
        padding: 0;
        font-weight: 600;
        font-size: 13.5px;
        cursor: pointer;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .name:hover {
        color: var(--oc-primary-text, #9fb4ff);
      }
      .path {
        display: block;
        color: var(--oc-muted, #8b8b96);
        font-family: var(--oc-mono, ui-monospace, monospace);
        font-size: 11px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .ago {
        color: var(--oc-muted, #8b8b96);
        font-size: 11px;
        white-space: nowrap;
        margin-top: 2px;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 1px 7px;
        border: 1px solid var(--oc-border, #2a2a31);
        border-radius: 99px;
        font-size: 11px;
        color: var(--oc-muted, #8b8b96);
        background: transparent;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .chip.link,
      .chip.edit {
        cursor: pointer;
      }
      .mini-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--oc-muted, #8b8b96);
        flex: none;
      }
      .mini-dot[data-live="up"] {
        background: var(--oc-success, #3fa06b);
      }
      .mini-dot[data-live="down"] {
        background: var(--oc-error, #d4544e);
      }
      .mini-dot[data-live="unknown"] {
        background: var(--oc-muted, #8b8b96);
      }
      .chip.link:hover,
      .chip.edit:hover {
        color: var(--oc-fg, #e8e8ea);
        background: var(--oc-hover, #22222b);
      }
      .chip.warn {
        color: var(--oc-warning-text, #e0a94f);
        border-color: color-mix(in srgb, var(--oc-warning, #b98226) 50%, var(--oc-border, #2a2a31));
      }
      .chip.fail {
        color: var(--oc-error-text, #f08a85);
        border-color: color-mix(in srgb, var(--oc-error, #d4544e) 50%, var(--oc-border, #2a2a31));
      }

      .summary {
        margin: 0;
        color: var(--oc-fg, #e8e8ea);
        font-size: 12.5px;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .summary.placeholder {
        color: var(--oc-muted, #8b8b96);
        font-style: italic;
      }
      .summary.skeleton {
        color: transparent;
        border-radius: 4px;
        background: linear-gradient(
          90deg,
          var(--oc-hover, #22222b) 0%,
          var(--oc-border, #2a2a31) 50%,
          var(--oc-hover, #22222b) 100%
        );
        background-size: 200% 100%;
        animation: shimmer 1.4s infinite;
        height: 34px;
      }
      @keyframes shimmer {
        from {
          background-position: 200% 0;
        }
        to {
          background-position: -200% 0;
        }
      }

      .stack {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .stack span {
        font-size: 10.5px;
        padding: 0 6px;
        border-radius: 4px;
        color: var(--oc-muted, #8b8b96);
        background: var(--oc-muted-surface, #1e1e26);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-top: 2px;
        padding-top: 8px;
        border-top: 1px solid var(--oc-border, #2a2a31);
      }
      .act {
        background: transparent;
        border: 1px solid transparent;
        border-radius: 6px;
        padding: 3px 7px;
        font-size: 11.5px;
        color: var(--oc-muted, #8b8b96);
        cursor: pointer;
      }
      .act:hover {
        color: var(--oc-fg, #e8e8ea);
        background: var(--oc-hover, #22222b);
      }
      .act.primary {
        color: var(--oc-primary-text, #9fb4ff);
        border-color: color-mix(in srgb, var(--oc-primary, #6c8cff) 45%, transparent);
      }
      .act.primary:hover {
        background: color-mix(in srgb, var(--oc-primary, #6c8cff) 14%, transparent);
      }
      .act:disabled {
        opacity: 0.4;
        cursor: default;
      }

      .editor {
        display: flex;
        gap: 5px;
        margin-top: 2px;
      }
      .editor input {
        flex: 1;
        min-width: 0;
        background: var(--oc-bg, #101014);
        border: 1px solid var(--oc-border, #2a2a31);
        border-radius: 6px;
        padding: 4px 7px;
        font-size: 11.5px;
      }

      /* ------------------------------------------------------------ detail */
      .grid[data-mode="detail"] {
        display: block;
      }
      .detail {
        max-width: 920px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .detail-head {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .detail-head .act {
        border: 1px solid var(--oc-border, #2a2a31);
        padding: 4px 9px;
      }
      .detail-identity {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      .detail-title {
        min-width: 0;
      }
      .detail-title h2 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .detail-summary {
        margin: 0;
        font-size: 13px;
        color: var(--oc-fg, #e8e8ea);
      }
      .avatar.lg {
        width: 40px;
        height: 40px;
        border-radius: 10px;
      }
      .avatar.lg img {
        border-radius: 10px;
      }
      .avatar.lg .avatar-letter {
        font-size: 17px;
      }
      .panel {
        border: 1px solid var(--oc-border, #2a2a31);
        border-radius: calc(var(--oc-radius, 10px) + 2px);
        background: var(--oc-elevated, #17171d);
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        flex-wrap: wrap;
      }
      .panel-head h3 {
        margin: 0;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--oc-muted, #8b8b96);
      }
      .seg {
        display: flex;
        gap: 4px;
      }
      .seg-btn {
        background: transparent;
        border: 1px solid var(--oc-border, #2a2a31);
        border-radius: 6px;
        padding: 2px 8px;
        font-size: 11px;
        color: var(--oc-muted, #8b8b96);
        cursor: pointer;
      }
      .seg-btn:hover {
        background: var(--oc-hover, #22222b);
        color: var(--oc-fg, #e8e8ea);
      }
      .seg-btn[aria-pressed="true"] {
        border-color: var(--oc-primary, #6c8cff);
        color: var(--oc-primary-text, #9fb4ff);
        background: color-mix(in srgb, var(--oc-primary, #6c8cff) 12%, transparent);
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));
        gap: 8px;
      }
      .stat {
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .stat b {
        font-size: 15px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .stat span {
        font-size: 10.5px;
        color: var(--oc-muted, #8b8b96);
      }
      .chart-wrap {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .chart {
        display: flex;
        align-items: flex-end;
        gap: 2px;
        height: 96px;
      }
      .chart-col {
        flex: 1;
        min-width: 1px;
        height: 100%;
        display: flex;
        align-items: flex-end;
      }
      .chart-bar {
        width: 100%;
        border-radius: 2px 2px 0 0;
        background: var(--oc-primary, #6c8cff);
        opacity: 0.85;
      }
      .chart-bar[data-zero="true"] {
        height: 2px !important;
        background: var(--oc-border, #2a2a31);
        opacity: 1;
      }
      .chart-legend {
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        color: var(--oc-muted, #8b8b96);
      }
      .plans {
        display: flex;
        flex-direction: column;
        gap: 9px;
      }
      .plan {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .plan-top {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .plan-title {
        flex: 1;
        min-width: 0;
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .progress {
        height: 4px;
        border-radius: 99px;
        background: var(--oc-border, #2a2a31);
        overflow: hidden;
      }
      .progress i {
        display: block;
        height: 100%;
        border-radius: 99px;
        background: var(--oc-success, #3fa06b);
      }
      .todos {
        margin: 0;
        padding-left: 16px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 12px;
      }
      .todos li {
        overflow-wrap: anywhere;
      }
      .muted {
        font-size: 12px;
        color: var(--oc-muted, #8b8b96);
      }

      .footer {
        padding: 6px 12px 10px;
        color: var(--oc-subtle, #6f6f7a);
        font-size: 11px;
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }

      /* ------------------------------------------------------ sections */
      .section {
        grid-column: 1 / -1;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .section-head {
        align-self: flex-start;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
        color: var(--oc-muted, #8b8b96);
        font-size: 12px;
      }
      .section-head b {
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        font-size: 11px;
      }
      .section-head:hover {
        color: var(--oc-fg, #e8e8ea);
      }
      .section-body {
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(auto-fill, minmax(272px, 1fr));
        align-content: start;
      }
      body[data-surface="panel"] .section-body {
        grid-template-columns: 1fr;
      }

      /* ----------------------------------------------------------- pin */
      .pin {
        background: none;
        border: 0;
        padding: 0 2px;
        cursor: pointer;
        color: var(--oc-muted, #8b8b96);
        font-size: 14px;
        line-height: 1;
      }
      .pin:hover {
        color: var(--oc-fg, #e8e8ea);
      }
      .pin[data-on="true"] {
        color: var(--oc-warning-text, #e0a94f);
      }
      .card.dim {
        opacity: 0.55;
      }

      /* -------------------------------------------------------- heatmap */
      .heat-wrap {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .heat-months {
        display: grid;
        gap: 3px;
        font-size: 10px;
        color: var(--oc-muted, #8b8b96);
      }
      .heat-months span {
        overflow: hidden;
        white-space: nowrap;
      }
      .heat {
        display: grid;
        grid-template-rows: repeat(7, 11px);
        gap: 3px;
      }
      .heat-cell {
        border-radius: 2px;
        min-width: 0;
      }
      .heat-cell[data-level="empty"] {
        background: transparent;
      }
      .heat-cell[data-level="0"] {
        background: var(--oc-muted-surface, #1e1e26);
      }
      .heat-cell[data-level="1"] {
        background: color-mix(in srgb, var(--oc-primary, #6c8cff) 22%, transparent);
      }
      .heat-cell[data-level="2"] {
        background: color-mix(in srgb, var(--oc-primary, #6c8cff) 45%, transparent);
      }
      .heat-cell[data-level="3"] {
        background: color-mix(in srgb, var(--oc-primary, #6c8cff) 70%, transparent);
      }
      .heat-cell[data-level="4"] {
        background: var(--oc-primary, #6c8cff);
      }

      /* ----------------------------------------------------- deployments */
      .dep-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 8px;
        padding: 8px 0;
        border-top: 1px solid var(--oc-border, #2a2a31);
      }
      .dep-host {
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
        font-weight: 600;
        font-size: 12.5px;
      }
      .dep-host:hover {
        color: var(--oc-primary-text, #9fb4ff);
      }
      .dep-facts {
        font-size: 11px;
      }
      .dep-down {
        font-size: 11px;
        color: var(--oc-error-text, #f08a85);
      }
      .probe-dots {
        display: flex;
        gap: 3px;
        align-items: center;
        flex-basis: 100%;
      }
      .probe-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--oc-muted, #8b8b96);
      }
      .probe-dot[data-live="up"] {
        background: var(--oc-success, #3fa06b);
      }
      .probe-dot[data-live="down"] {
        background: var(--oc-error, #d4544e);
      }
      .cert {
        font-size: 10px;
        padding: 0 5px;
        border-radius: 4px;
        border: 1px solid transparent;
      }
      .cert.warn {
        color: var(--oc-warning-text, #e0a94f);
        border-color: color-mix(in srgb, var(--oc-warning, #b98226) 50%, transparent);
      }
      .cert.fail {
        color: var(--oc-error-text, #f08a85);
        border-color: color-mix(in srgb, var(--oc-error, #d4544e) 50%, transparent);
      }
      .empty {
        grid-column: 1 / -1;
        text-align: center;
        color: var(--oc-muted, #8b8b96);
        padding: 40px 12px;
      }
      .empty b {
        display: block;
        color: var(--oc-fg, #e8e8ea);
        margin-bottom: 4px;
      }
    </style>
  </head>
  <body data-surface="panel">
    <header class="bar">
      <div class="title">Projects <span class="count" id="count"></span></div>
      <input class="search" id="search" type="search" placeholder="Filter…" aria-label="Filter projects" />
      <select class="sort" id="sort" aria-label="Sort projects">
        <option value="attention">Needs me</option>
        <option value="recent">Recent</option>
        <option value="name">Name</option>
        <option value="size">Size</option>
      </select>
      <button class="toggle" id="group" aria-pressed="true" title="Group the board into sections">Group: On</button>
      <button class="icon-btn" id="hidden-toggle" title="Show hidden projects">Hidden (0)</button>
      <label class="toggle" title="Write an AI blurb for each project">
        <input type="checkbox" id="ai" /> AI
      </label>
      <button class="icon-btn" id="refresh" title="Re-read every project">Refresh</button>
    </header>

    <div class="notice" id="notice"></div>
    <div class="grid" id="grid"></div>
    <div class="footer" id="footer"></div>

    <script src="main.js"></script>
  </body>
</html>
